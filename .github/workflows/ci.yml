name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check dependency advisories
        run: npm audit --audit-level=high

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Start local Supabase stack
        run: npx --yes supabase@2.119.0 start

      - name: Apply migrations to a clean database
        run: npx --yes supabase@2.119.0 db reset --local

      - name: Run pgTAP RLS and schema tests
        run: |
          set +e
          npx --yes supabase@2.119.0 test db --local 2>&1 | tee "$RUNNER_TEMP/pgtap.log"
          test_status=${PIPESTATUS[0]}
          cat "$RUNNER_TEMP/pgtap.log" >> "$GITHUB_STEP_SUMMARY"
          exit "$test_status"

      - name: Stop local Supabase
        if: always()
        run: npx --yes supabase@2.119.0 stop --no-backup
